<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="A shared audit tracker and report." />
    <title>Audit tracker</title>
  </head>
  <body>
    <header>
      <a href="#main-content">Skip to content</a>
      <p>Audit tracker</p>
      <nav aria-label="Primary navigation">
        <a href="#tracker">Tracker</a>
        <a href="#report">Report</a>
      </nav>
    </header>
    <main id="main-content" tabindex="-1">
      <section id="tracker" aria-labelledby="tracker-heading">
        <h1 id="tracker-heading">Audit tracker</h1>
        <p role="status" aria-live="polite">Loading the shared audit board.</p>
      </section>
      <section id="report" aria-labelledby="report-heading">
        <h2 id="report-heading">Audit report</h2>
        <p>The complete source report will be available here.</p>
      </section>
    </main>
  </body>
</html>
